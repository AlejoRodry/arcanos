<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08101E"/>
      <stop offset="60%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <radialGradient id="auraGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Radiant Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#auraGold)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 12"/>
  
  <!-- Astrolabe Ring Structure -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" opacity="0.85"/>
  
  <!-- Eight Sacred Cardinal Points -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.75">
    <line x1="256" y1="64" x2="256" y2="96"/>
    <line x1="256" y1="416" x2="256" y2="448"/>
    <line x1="64" y1="256" x2="96" y2="256"/>
    <line x1="416" y1="256" x2="448" y2="256"/>
    <line x1="120" y1="120" x2="144" y2="144"/>
    <line x1="368" y1="368" x2="392" y2="392"/>
    <line x1="392" y1="120" x2="368" y2="144"/>
    <line x1="120" y1="392" x2="144" y2="368"/>
  </g>

  <!-- Central Octagram Star of Destiny -->
  <polygon points="256,128 290,222 384,256 290,290 256,384 222,290 128,256 222,222" 
           fill="url(#goldGrad)" opacity="0.25"/>
  <polygon points="256,150 282,230 362,256 282,282 256,362 230,282 150,256 230,230" 
           fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="256,174 274,238 338,256 274,274 256,338 238,274 174,256 238,238" 
           transform="rotate(45 256 256)"
           fill="none" stroke="#FCEBA4" stroke-width="1.8" opacity="0.7"/>

  <!-- Center Diamond & Radiant Sparkle -->
  <circle cx="256" cy="256" r="16" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
</svg>
